<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AI Training Playground</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>AI Training Playground</h1>
    <p class="subtitle">Describe con tus palabras la tarea que quieres entrenar. La IA la construye; tú entrenas y observas en vivo.</p>
  </header>

  <main>
    <section class="panel controls">
      <label for="task-input">¿Qué quieres que aprenda a hacer?</label>
      <textarea id="task-input" rows="3" placeholder="Ej: un agente que empuje un balón hasta una portería, evitando un obstáculo por el medio"></textarea>
      <div class="buttons">
        <button id="generate-btn">Generar tarea con IA</button>
      </div>
      <p id="generate-status" class="status"></p>

      <div id="task-result" class="task-result hidden">
        <strong id="task-name"></strong>
        <span id="task-kind-badge" class="badge"></span>
        <p id="task-description"></p>
      </div>

      <div id="classification-panel" class="hidden">
        <label for="example-text">Añadir ejemplo real (opcional, mejora el modelo)</label>
        <textarea id="example-text" rows="2" placeholder="Pega aquí un ejemplo real..."></textarea>
        <select id="example-label"></select>
        <div class="buttons">
          <button id="add-example-btn">Añadir ejemplo</button>
        </div>
        <p id="examples-status" class="status"></p>

        <label for="predict-text">Probar el modelo entrenado</label>
        <textarea id="predict-text" rows="2" placeholder="Escribe un texto para clasificar..."></textarea>
        <div class="buttons">
          <button id="predict-btn">Clasificar</button>
        </div>
        <div id="predict-result" class="task-result hidden"></div>
      </div>

      <div class="buttons">
        <button id="start-btn" disabled>Iniciar entrenamiento</button>
        <button id="stop-btn" disabled>Detener</button>
      </div>

      <div class="metrics">
        <div><span id="m-label-1">Paso</span><strong id="m-1">0</strong></div>
        <div><span id="m-label-2">Episodio</span><strong id="m-2">0</strong></div>
        <div><span id="m-label-3">Ultima recompensa</span><strong id="m-3">0</strong></div>
        <div><span id="m-label-4">Media (100 ep.)</span><strong id="m-4">0</strong></div>
      </div>

      <canvas id="reward-chart" width="320" height="140"></canvas>
    </section>

    <section class="panel viewer">
      <div id="scene-container"></div>
      <div id="legend" class="legend hidden"></div>
      <p class="viewer-hint" id="viewer-hint"></p>
    </section>
  </main>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="js/scene.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
